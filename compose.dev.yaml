name: logis

x-laravel: &laravel
  build:
    context: ./docker/php
    args:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
  image: logis/laravel:dev
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  depends_on:
    mysql:
      condition: service_healthy

services:
  laravel:
    <<: *laravel

  # Consumes the queue (async listeners). queue:listen reloads the code on every job,
  # so changes apply without restarting the container.
  worker:
    <<: *laravel
    command: ["php", "artisan", "queue:listen", "--queue=events,default", "--tries=3", "--sleep=1", "--timeout=60"]
    restart: unless-stopped

  # Runs the Laravel scheduler (hourly pruning of expired access tokens).
  scheduler:
    <<: *laravel
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - laravel

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-logis}
      MYSQL_USER: ${DB_USERNAME:-logis}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  apidocs:
    image: swaggerapi/swagger-ui
    ports:
      - "${APIDOCS_PORT:-8080}:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.json
    volumes:
      - ./docs:/spec:ro
      - ./docker/apidocs/swagger-initializer.js:/logis/swagger-initializer.js:ro
      - ./docker/apidocs/50-logis-initializer.sh:/docker-entrypoint.d/50-logis-initializer.sh:ro

volumes:
  mysql-data:
