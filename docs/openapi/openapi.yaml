openapi: 3.1.0
info:
  title: Logis API
  version: "1.0"
  license:
    name: Proprietary
  description: |
    Logis API: authentication, global search and custom asset views.

    ## Authentication and token rotation

    1. `POST /auth/login` returns a bearer token that expires after 60 minutes without use.
    2. Every authenticated request (except `logout` and `refresh`) rotates the token. The new token arrives in the
       `X-Refreshed-Token` response header. Whenever that header is present, replace the stored token.
       When it is absent, keep the current one.
    3. The previous token keeps working for a 10 second grace period, so requests fired in parallel with the
       old token still succeed. Only one of them receives a new token.
    4. `POST /auth/refresh` rotates explicitly and returns the new token in the body.
    5. `POST /auth/logout` revokes the current token and its predecessor if it is still in its grace period.

    In this Swagger UI the token is handled automatically. Login and refresh authorize the session, every
    `X-Refreshed-Token` replaces the stored token, and logout clears it. Log in with `demo@logis.test` / `password`.

    Every response, success or error, uses the same format: `{ success, data, message, meta }`.
    The HTTP status tells the client what happened. The API allows 60 requests per minute.
servers:
  - url: http://localhost:8000/api/v1
security:
  - sanctum: []
tags:
  - name: Auth
    description: Login, token rotation, refresh, logout and the authenticated user.
  - name: Search
    description: Global search across the entities of the customers the user can see.
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: demo@logis.test
                password:
                  type: string
                  maxLength: 255
                  example: password
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the current token explicitly
      operationId: refresh
      responses:
        "200":
          description: Token refreshed. The previous token keeps working during the grace period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The token was already rotated by a concurrent request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      operationId: logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user
      operationId: me
      responses:
        "200":
          description: Authenticated user
          headers:
            X-Refreshed-Token:
              $ref: "#/components/headers/XRefreshedToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /search:
    get:
      tags: [Search]
      summary: Search tickets across the visible customers
      operationId: search
      description: |
        Searches each requested entity for `q` and returns, per entity, the newest matches up to `limit`,
        the total number of matches and whether there are more.

        The server decides which customers the user can see: their own customer and, when the user has the
        sub-account permission, its sub-accounts. A user without a customer gets empty results.

        | Entity | Searched fields (contains, case-insensitive) | Extra filter |
        |---|---|---|
        | `tickets` | subject, repair id, incident number | not deleted |

        The term is matched literally: `%` and `_` are not wildcards. Results are cached for 5 minutes.
      parameters:
        - name: q
          in: query
          required: true
          description: Search term. Leading and trailing spaces are removed, and it must not be empty.
          schema:
            type: string
          example: zebra
        - name: limit
          in: query
          required: false
          description: Maximum number of results per entity.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
        - name: entities
          in: query
          required: false
          description: |
            Entities to search, comma-separated (`entities=tickets,assets`). The array form
            `entities[]=tickets&entities[]=assets` is accepted too. Duplicates are ignored.
            All entities are searched when it is absent.
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: "#/components/schemas/SearchableEntity"
      responses:
        "200":
          description: Search results
          headers:
            X-Refreshed-Token:
              $ref: "#/components/headers/XRefreshedToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      description: Sanctum access token. When it is rotated, the new one arrives in the X-Refreshed-Token header.
  headers:
    XRefreshedToken:
      description: The rotated token. Replace the stored token with it. Absent when a concurrent request already rotated the token.
      schema:
        type: string
  schemas:
    Meta:
      type: object
      required: [timestamp, version]
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-09-25T10:00:00Z"
        version:
          type: string
          example: "1.0"
        execution_time_ms:
          type: integer
          example: 12
    AccessToken:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          example: Xk29b1Q7aT0mZc8FvL3nR5pW2yH6jD4sE9uK1oB0c3a8f71e
        expires_at:
          type: string
          format: date-time
          example: "2026-09-25T11:00:00Z"
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Demo
        email:
          type: string
          format: email
          example: demo@logis.test
    AccessTokenResponse:
      type: object
      required: [success, data, message, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/AccessToken"
        message:
          type: string
          example: Logged in
        meta:
          $ref: "#/components/schemas/Meta"
    UserResponse:
      type: object
      required: [success, data, message, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/User"
        message:
          type: string
          example: Authenticated user
        meta:
          $ref: "#/components/schemas/Meta"
    SearchableEntity:
      type: string
      enum: [tickets]
    TicketSearchResult:
      type: object
      required: [id, repair_id, incident_number, subject, status]
      properties:
        id:
          type: integer
          example: 812
        repair_id:
          type: string
          example: R-10231
        incident_number:
          type: string
          example: INC-5521
        subject:
          type: string
          example: Zebra printer jams
        status:
          type: string
          description: Name of the ticket status
          example: Open
    SearchResults:
      type: object
      required: [results, total, has_more]
      properties:
        results:
          type: array
        total:
          type: integer
          description: Number of matches, before the limit
          example: 24
        has_more:
          type: boolean
          description: Whether total is greater than the limit
          example: true
    SearchMeta:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [query, limit_per_entity]
          properties:
            query:
              type: string
              description: The trimmed search term
              example: zebra
            limit_per_entity:
              type: integer
              example: 5
    SearchResponse:
      type: object
      required: [success, data, message, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          description: One entry per requested entity, in the order tickets, assets, contracts, locations.
          properties:
            tickets:
              allOf:
                - $ref: "#/components/schemas/SearchResults"
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: "#/components/schemas/TicketSearchResult"
        message:
          type: string
          example: Search results
        meta:
          $ref: "#/components/schemas/SearchMeta"
    EmptyResponse:
      type: object
      required: [success, data, message, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          maxProperties: 0
        message:
          type: string
          example: Logged out
        meta:
          $ref: "#/components/schemas/Meta"
    ErrorResponse:
      type: object
      required: [success, data, message, meta]
      properties:
        success:
          type: boolean
          const: false
        data:
          type: object
          description: Error details. Validation errors list the messages per field.
          additionalProperties:
            type: array
            items:
              type: string
        message:
          type: string
        meta:
          $ref: "#/components/schemas/Meta"
  responses:
    Unauthorized:
      description: Missing, invalid or expired token, or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: {}
            message: Unauthenticated
            meta:
              timestamp: "2026-09-25T10:00:00Z"
              version: "1.0"
              execution_time_ms: 3
    ValidationFailed:
      description: The request data is not valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data:
              email:
                - The email field must be a valid email address.
            message: Validation failed
            meta:
              timestamp: "2026-09-25T10:00:00Z"
              version: "1.0"
              execution_time_ms: 4
    TooManyRequests:
      description: More than 60 requests in a minute
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
