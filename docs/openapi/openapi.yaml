openapi: 3.1.0
info:
  title: Logis API
  version: "1.0"
  license:
    name: Proprietary
  description: |
    Logis API: authentication, global search and custom asset views.

    ## Authentication and token rotation

    1. `POST /auth/login` returns a bearer token that expires after 60 minutes without use.
    2. Every authenticated request (except `logout` and `refresh`) rotates the token. The new token arrives in the
       `X-Refreshed-Token` response header. Whenever that header is present, replace the stored token.
       When it is absent, keep the current one.
    3. The previous token keeps working for a 10 second grace period, so requests fired in parallel with the
       old token still succeed. Only one of them receives a new token.
    4. `POST /auth/refresh` rotates explicitly and returns the new token in the body.
    5. `POST /auth/logout` revokes the current token and its predecessor if it is still in its grace period.

    In this Swagger UI the token is handled automatically. Login and refresh authorize the session, every
    `X-Refreshed-Token` replaces the stored token, and logout clears it. Log in with `demo@logis.test` / `password`.

    Every response, success or error, uses the same format: `{ success, data, message, meta }`.
    The HTTP status tells the client what happened. The API allows 60 requests per minute.
servers:
  - url: http://localhost:8000/api/v1
security:
  - sanctum: []
tags:
  - name: Auth
    description: Login, token rotation, refresh, logout and the authenticated user.
  - name: Search
    description: Global search across the entities of the customers the user can see.
  - name: Views
    description: |
      Custom views: saved columns and filters over assets, tickets, contracts or locations.
      A user sees their own views and the public views of their own customer. Only the owner can change,
      delete or set a view as default. A view the user cannot see answers 404.
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: demo@logis.test
                password:
                  type: string
                  maxLength: 255
                  example: password
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the current token explicitly
      operationId: refresh
      responses:
        "200":
          description: Token refreshed. The previous token keeps working during the grace period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The token was already rotated by a concurrent request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      operationId: logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user
      operationId: me
      responses:
        "200":
          description: Authenticated user
          headers:
            X-Refreshed-Token:
              $ref: "#/components/headers/XRefreshedToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /search:
    get:
      tags: [Search]
      summary: Search tickets, assets, contracts and locations across the visible customers
      operationId: search
      description: |
        Searches each requested entity for `q` and returns, per entity, the newest matches up to `limit`,
        the total number of matches and whether there are more.

        The server decides which customers the user can see: their own customer and, when the user has the
        sub-account permission, its sub-accounts. A user without a customer gets empty results.

        | Entity | Searched fields (contains, case-insensitive) | Extra filter |
        |---|---|---|
        | `tickets` | subject, repair id, incident number | not deleted |
        | `assets` | serial number, manufacturer, model | not deleted, any status |
        | `contracts` | name | active only |
        | `locations` | title, full address, city, state, postal code | — |

        The term is matched literally: `%` and `_` are not wildcards. Results are cached for 5 minutes.
      parameters:
        - name: q
          in: query
          required: true
          description: Search term, as valid UTF-8 text. Leading and trailing spaces are removed, and it must not be empty.
          schema:
            type: string
          example: zebra
        - name: limit
          in: query
          required: false
          description: Maximum number of results per entity. Absent or empty means 5.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
        - name: entities
          in: query
          required: false
          description: |
            Entities to search, comma-separated (`entities=tickets,assets`). The array form
            `entities[]=tickets&entities[]=assets` is accepted too. Duplicates and empty values are ignored.
            All entities are searched when it is absent.
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: "#/components/schemas/SearchableEntity"
      responses:
        "200":
          description: Search results
          headers:
            X-Refreshed-Token:
              $ref: "#/components/headers/XRefreshedToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /views:
    get:
      tags: [Views]
      summary: List the views the user can see
      operationId: listViews
      description: |
        Returns the user's own views and the public views of the user's customer, ordered by title.
        There is no pagination. A user without a customer gets an empty list.
      parameters:
        - name: type
          in: query
          required: false
          description: Only views of this type.
          schema:
            $ref: "#/components/schemas/ViewType"
      responses:
        "200":
          description: Views the user can see
          headers:
            X-Refreshed-Token:
              $ref: "#/components/headers/XRefreshedToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomViewListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Views]
      summary: Create a view
      operationId: createView
      description: |
        Creates a view owned by the user, for the user's customer. The columns and filters must belong to the
        field catalog of the view type (see `ViewFilter`); otherwise the response is 422 with a message that
        names the column or filter. A new view is never the default: use `set-default`.

        | View type | Fields |
        |---|---|
        | `my_assets` | id, serial_number, manufacturer, model, item_name, status, customer, contract, location, created_at, updated_at |
        | `my_tickets` | id, repair_id, incident_number, subject, status, asset, customer, created_at, updated_at |
        | `my_contracts` | id, name, status, customer, created_at, updated_at |
        | `my_locations` | id, title, full_address, city, state, postal_code, customer, created_at, updated_at |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CustomViewInput"
                - type: object
                  required: [view_type]
                  properties:
                    view_type:
                      $ref: "#/components/schemas/ViewType"
      responses:
        "201":
          description: The created view
          headers:
            X-Refreshed-Token:
              $ref: "#/components/headers/XRefreshedToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomViewDetailsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /views/{id}:
    parameters:
      - $ref: "#/components/parameters/ViewId"
    get:
      tags: [Views]
      summary: Get the details of a view
      operationId: getView
      responses:
        "200":
          description: View details
          headers:
            X-Refreshed-Token:
              $ref: "#/components/headers/XRefreshedToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomViewDetailsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags: [Views]
      summary: Replace a view
      operationId: updateView
      description: |
        Replaces the title, description, columns, filters and `is_public` of a view. Only the owner can do it.
        `view_type` can't change: it may be sent, but only with the current value. The same catalog rules as
        creation apply, and an absent `is_public` means `false`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CustomViewInput"
                - type: object
                  properties:
                    view_type:
                      $ref: "#/components/schemas/ViewType"
      responses:
        "200":
          description: The updated view
          headers:
            X-Refreshed-Token:
              $ref: "#/components/headers/XRefreshedToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomViewDetailsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Views]
      summary: Delete a view
      operationId: deleteView
      description: Deletes a view. Only the owner can do it. Deleting the default view leaves its type without a default.
      responses:
        "200":
          description: The view was deleted
          headers:
            X-Refreshed-Token:
              $ref: "#/components/headers/XRefreshedToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
              example:
                success: true
                data: {}
                message: View deleted
                meta:
                  timestamp: "2026-09-25T10:00:00Z"
                  version: "1.0"
                  execution_time_ms: 7
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      description: Sanctum access token. When it is rotated, the new one arrives in the X-Refreshed-Token header.
  parameters:
    ViewId:
      name: id
      in: path
      required: true
      description: View id
      schema:
        type: integer
        minimum: 1
      example: 7
  headers:
    XRefreshedToken:
      description: The rotated token. Replace the stored token with it. Absent when a concurrent request already rotated the token.
      schema:
        type: string
  schemas:
    Meta:
      type: object
      required: [timestamp, version]
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-09-25T10:00:00Z"
        version:
          type: string
          example: "1.0"
        execution_time_ms:
          type: integer
          example: 12
    AccessToken:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          example: Xk29b1Q7aT0mZc8FvL3nR5pW2yH6jD4sE9uK1oB0c3a8f71e
        expires_at:
          type: string
          format: date-time
          example: "2026-09-25T11:00:00Z"
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Demo
        email:
          type: string
          format: email
          example: demo@logis.test
    AccessTokenResponse:
      type: object
      required: [success, data, message, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/AccessToken"
        message:
          type: string
          example: Logged in
        meta:
          $ref: "#/components/schemas/Meta"
    UserResponse:
      type: object
      required: [success, data, message, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/User"
        message:
          type: string
          example: Authenticated user
        meta:
          $ref: "#/components/schemas/Meta"
    SearchableEntity:
      type: string
      enum: [tickets, assets, contracts, locations]
    TicketSearchResult:
      type: object
      required: [id, repair_id, incident_number, subject, status]
      properties:
        id:
          type: integer
          example: 812
        repair_id:
          type: string
          example: R-10231
        incident_number:
          type: string
          example: INC-5521
        subject:
          type: string
          example: Zebra printer jams
        status:
          type: string
          description: Name of the ticket status
          example: Open
    AssetSearchResult:
      type: object
      required: [id, serial_number, manufacturer, model, item_name, status]
      properties:
        id:
          type: integer
          example: 77
        serial_number:
          type: string
          example: ZB-00931
        manufacturer:
          type: string
          example: Zebra
        model:
          type: string
          example: ZT410
        item_name:
          type: string
          example: Label printer
        status:
          type: string
          enum: [active, inactive, retired]
          example: active
    ContractSearchResult:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
          example: 4
        name:
          type: string
          example: TrueSupport 2024
        status:
          type: string
          enum: [active]
          example: active
    LocationSearchResult:
      type: object
      required: [id, title, city, state, postal_code]
      properties:
        id:
          type: integer
          example: 9
        title:
          type: string
          example: Austin Warehouse
        city:
          type: [string, "null"]
          example: Austin
        state:
          type: [string, "null"]
          example: Texas
        postal_code:
          type: [string, "null"]
          example: "73301"
    SearchResults:
      type: object
      required: [results, total, has_more]
      properties:
        results:
          type: array
        total:
          type: integer
          description: Number of matches, before the limit
          example: 24
        has_more:
          type: boolean
          description: Whether total is greater than the limit
          example: true
    SearchMeta:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [query, limit_per_entity]
          properties:
            query:
              type: string
              description: The trimmed search term
              example: zebra
            limit_per_entity:
              type: integer
              example: 5
    SearchResponse:
      type: object
      required: [success, data, message, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          description: One entry per requested entity, in the order tickets, assets, contracts, locations.
          properties:
            tickets:
              allOf:
                - $ref: "#/components/schemas/SearchResults"
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: "#/components/schemas/TicketSearchResult"
            assets:
              allOf:
                - $ref: "#/components/schemas/SearchResults"
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: "#/components/schemas/AssetSearchResult"
            contracts:
              allOf:
                - $ref: "#/components/schemas/SearchResults"
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: "#/components/schemas/ContractSearchResult"
            locations:
              allOf:
                - $ref: "#/components/schemas/SearchResults"
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: "#/components/schemas/LocationSearchResult"
        message:
          type: string
          example: Search results
        meta:
          $ref: "#/components/schemas/SearchMeta"
    ViewType:
      type: string
      enum: [my_assets, my_tickets, my_contracts, my_locations]
    FilterOperator:
      type: string
      enum: [eq, neq, in, not_in, contains, gt, gte, lt, lte, between, in_last_days]
    ViewFilter:
      type: object
      required: [column, operator, value]
      description: |
        A filter on one field of the view type. Filters are combined with AND.

        | Field type | Operators | Value |
        |---|---|---|
        | text | `eq`, `neq`, `contains` / `in`, `not_in` | 1 to 255 characters / a list of 1 to 100 |
        | choice (`status` of assets and contracts) | `eq`, `neq` / `in`, `not_in` | one of the allowed values / a list |
        | identifier (`id` and relations such as `location`, `contract`, `customer`, ticket `status`, `asset`) | `eq` / `in`, `not_in` | a positive integer id / a list |
        | date (`created_at`, `updated_at`) | `gt`, `gte`, `lt`, `lte` / `between` / `in_last_days` | a `Y-m-d` date / two dates / 0 to 365 days |

        Dates are whole UTC days: `gt 2024-01-01` starts on 2024-01-02, `between` includes both days and
        `in_last_days 0` is today. `contains` matches literally, `%` and `_` are not wildcards.
      properties:
        column:
          type: string
          example: manufacturer
        operator:
          $ref: "#/components/schemas/FilterOperator"
        value:
          description: A string, an integer, or a list of them, depending on the operator.
          oneOf:
            - type: string
            - type: integer
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: integer
          example: Zebra
    CustomViewInput:
      type: object
      required: [title, columns, filters]
      properties:
        title:
          type: string
          maxLength: 255
          description: Unique among the views of the owner
          example: Zebra scanners
        description:
          type: [string, "null"]
          maxLength: 1000
          example: Every active Zebra device
        columns:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          example: [serial_number, manufacturer, model, location]
        filters:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ViewFilter"
        is_public:
          type: boolean
          default: false
          description: Share the view with the users of the owner's customer
    CustomViewListItem:
      type: object
      required: [id, title, description, view_type, is_default, is_public, is_owner]
      properties:
        id:
          type: integer
          example: 7
        title:
          type: string
          example: Zebra scanners
        description:
          type: [string, "null"]
          example: Every active Zebra device
        view_type:
          $ref: "#/components/schemas/ViewType"
        is_default:
          type: boolean
          description: Whether this is the requesting user's default view of its type
        is_public:
          type: boolean
          description: Whether the view is shared with the users of its customer
        is_owner:
          type: boolean
          description: Whether the requesting user owns the view and can change it
    CustomViewDetails:
      allOf:
        - $ref: "#/components/schemas/CustomViewListItem"
        - type: object
          required: [columns, filters, owner]
          properties:
            columns:
              type: array
              description: Fields shown by the view, in order
              items:
                type: string
              example: [serial_number, manufacturer, model, location]
            filters:
              type: array
              items:
                $ref: "#/components/schemas/ViewFilter"
            owner:
              type: object
              required: [id, name]
              properties:
                id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: Demo
    CustomViewListResponse:
      type: object
      required: [success, data, message, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/CustomViewListItem"
        message:
          type: string
          example: Views
        meta:
          allOf:
            - $ref: "#/components/schemas/Meta"
            - type: object
              required: [total]
              properties:
                total:
                  type: integer
                  example: 3
    CustomViewDetailsResponse:
      type: object
      required: [success, data, message, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/CustomViewDetails"
        message:
          type: string
          example: View details
        meta:
          $ref: "#/components/schemas/Meta"
    EmptyResponse:
      type: object
      required: [success, data, message, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          maxProperties: 0
        message:
          type: string
          example: Logged out
        meta:
          $ref: "#/components/schemas/Meta"
    ErrorResponse:
      type: object
      required: [success, data, message, meta]
      properties:
        success:
          type: boolean
          const: false
        data:
          type: object
          description: Error details. Validation errors list the messages per field.
          additionalProperties:
            type: array
            items:
              type: string
        message:
          type: string
        meta:
          $ref: "#/components/schemas/Meta"
  responses:
    Unauthorized:
      description: Missing, invalid or expired token, or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: {}
            message: Unauthenticated
            meta:
              timestamp: "2026-09-25T10:00:00Z"
              version: "1.0"
              execution_time_ms: 3
    ValidationFailed:
      description: The request data is not valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data:
              email:
                - The email field must be a valid email address.
            message: Validation failed
            meta:
              timestamp: "2026-09-25T10:00:00Z"
              version: "1.0"
              execution_time_ms: 4
    TooManyRequests:
      description: More than 60 requests in a minute
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The user can see the resource but is not allowed to change it
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: {}
            message: Only the owner of view 7 can change it.
            meta:
              timestamp: "2026-09-25T10:00:00Z"
              version: "1.0"
              execution_time_ms: 5
    Conflict:
      description: The request conflicts with the current state, such as a title the owner already uses
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: {}
            message: You already have a view called "Zebra scanners".
            meta:
              timestamp: "2026-09-25T10:00:00Z"
              version: "1.0"
              execution_time_ms: 6
    NotFound:
      description: The resource does not exist, or the user cannot see it
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            data: {}
            message: View 7 not found.
            meta:
              timestamp: "2026-09-25T10:00:00Z"
              version: "1.0"
              execution_time_ms: 4
